# Backend Pipeline - Auto-runs on backend code changes
# Deploys to: SQA-Mangement-backend Web App Service

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/**
      - azure-pipelines-backend.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/**

pool:
  vmImage: 'windows-latest'

variables:
  - group: sqa-backend-vars
  - name: backendAppName
    value: 'SQA-Mangement-backend'
  - name: pythonVersion
    value: '3.11'

stages:
  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Backend'
    jobs:
      - job: BuildBackend
        displayName: 'Build and Package Backend'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            workingDirectory: 'backend'
            displayName: 'Install Dependencies'

          - script: |
              pip install pytest pytest-asyncio
              python -m pytest tests/ -v --junitxml=junit/test-results.xml || true
            workingDirectory: 'backend'
            condition: succeeded()
            displayName: 'Run Tests (Optional)'
            continueOnError: true

          - task: PublishTestResults@2
            condition: succeeded()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/test-results.xml'
              failTaskOnFailedTests: false
            displayName: 'Publish Test Results'

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/backend
              cp -r . $(Build.ArtifactStagingDirectory)/backend/
              cd $(Build.ArtifactStagingDirectory)/backend
              rm -rf __pycache__ .pytest_cache venv .venv
              find . -type d -name __pycache__ -exec rm -rf {} + || true
            workingDirectory: 'backend'
            displayName: 'Prepare Backend Files'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/backend'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Create Backend Archive'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'backend-drop'
              publishLocation: 'Container'
            displayName: 'Publish Artifacts'

  # ============================================
  # DEPLOY STAGE
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/prod'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    dependsOn: Build
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy Backend to Web App'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'backend-drop'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Artifacts'

                - powershell: |
                    $profilePath = "$(Pipeline.Workspace)\profiles\backend-publishprofile.xml"
                    New-Item -ItemType Directory -Path (Split-Path $profilePath) -Force | Out-Null
                    $profileContent = @"
                    $(backendPublishProfile)
                    "@
                    [System.IO.File]::WriteAllText($profilePath, $profileContent.Trim())
                    Write-Host "Profile created at: $profilePath"
                  displayName: 'Create Publish Profile from Variable'

                - task: AzureRmWebAppDeployment@4
                  inputs:
                    ConnectionType: 'PublishProfile'
                    PublishProfilePath: '$(Pipeline.Workspace)\profiles\backend-publishprofile.xml'
                    PublishProfilePassword: '$(backendPublishProfilePassword)'
                    PackageForLinux: '$(Pipeline.Workspace)\backend-drop\backend-*.zip'
                    WebAppName: '$(backendAppName)'
                  displayName: 'Deploy Backend using Publish Profile'

                - powershell: |
                    Write-Host "==== BACKEND DEPLOYMENT COMPLETE ===="
                    Write-Host "Backend URL: https://$(backendAppName).azurewebsites.net"
                    Write-Host "API Docs: https://$(backendAppName).azurewebsites.net/docs"
                    Write-Host "Health: https://$(backendAppName).azurewebsites.net/health"
                  displayName: 'Verify Backend Deployment'
                  continueOnError: true
