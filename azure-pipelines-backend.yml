# Backend Pipeline - Auto-runs on backend code changes
# Deploys to: SQA-Mangement-backend Web App Service

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/**
      - azure-pipelines-backend.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/**

pool:
  vmImage: 'windows-latest'

variables:
  - group: sqa-backend-vars
  - name: backendAppName
    value: 'SQA-Mangement-backend'
  - name: pythonVersion
    value: '3.11'

stages:
  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Backend'
    jobs:
      - job: BuildBackend
        displayName: 'Build and Package Backend'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            workingDirectory: 'backend'
            displayName: 'Install Dependencies'

          - script: |
              pip install pytest pytest-asyncio
              python -m pytest tests/ -v --junitxml=junit/test-results.xml || true
            workingDirectory: 'backend'
            condition: succeeded()
            displayName: 'Run Tests (Optional)'
            continueOnError: true

          - task: PublishTestResults@2
            condition: succeeded()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit/test-results.xml'
              failTaskOnFailedTests: false
            displayName: 'Publish Test Results'

          - powershell: |
              New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\backend" -Force | Out-Null
              Copy-Item -Path "backend\*" -Destination "$(Build.ArtifactStagingDirectory)\backend\" -Recurse -Force
              Remove-Item -Path "$(Build.ArtifactStagingDirectory)\backend\__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "$(Build.ArtifactStagingDirectory)\backend\.pytest_cache" -Recurse -Force -ErrorAction SilentlyContinue
            displayName: 'Prepare Backend Files'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/backend'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Create Backend Archive'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'backend-drop'
              publishLocation: 'Container'
            displayName: 'Publish Artifacts'

  # ============================================
  # DEPLOY STAGE
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/prod'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    dependsOn: Build
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy Backend to Web App'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'backend-drop'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Artifacts'

                - powershell: |
                    [xml]$publishProfile = Get-Content "$(Build.SourcesDirectory)\backend-publishprofile.xml"
                    $password = $publishProfile.publishData.publishProfile[0].userPWD
                    Write-Host "##vso[task.setvariable variable=publishPassword;issecret=true]$password"
                  displayName: 'Extract Publish Profile Password'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: ''
                    appType: 'webAppLinux'
                    appName: 'SQA-Mangement-backend'
                    package: '$(Pipeline.Workspace)/backend-drop/backend-*.zip'
                    deploymentMethod: 'zipDeploy'
                  env:
                    AZURE_WEB_APP_PUBLISH_PROFILE: '$(Build.SourcesDirectory)\backend-publishprofile.xml'
                    AZURE_WEB_APP_PUBLISH_PASSWORD: '$(publishPassword)'
                  displayName: 'Deploy Backend using Publish Profile'

                - powershell: |
                    Write-Host "==== BACKEND DEPLOYMENT COMPLETE ===="
                    Write-Host "Backend URL: https://$(backendAppName).azurewebsites.net"
                  displayName: 'Verify Backend Deployment'
                  continueOnError: true
