# Frontend Pipeline - Auto-runs on frontend code changes
# Deploys to: SQA-Management-frontend Web App Service

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - frontend/**
      - azure-pipelines-frontend.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - frontend/**

pool:
  vmImage: 'windows-latest'

variables:
  - group: sqa-backend-vars
  - name: frontendAppName
    value: 'SQA-Management-frontend'
  - name: nodeVersion
    value: '20.x'

stages:
  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Frontend'
    jobs:
      - job: BuildFrontend
        displayName: 'Build and Package Frontend'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
              addToPath: true
            displayName: 'Install Node.js $(nodeVersion)'

          - script: |
              npm --version
              node --version
            displayName: 'Check Node/NPM Versions'

          - script: |
              npm install
            workingDirectory: 'frontend'
            displayName: 'Install Dependencies'

          - script: |
              npm run lint || true
            workingDirectory: 'frontend'
            displayName: 'Run Linter (Optional)'
            continueOnError: true

          - script: |
              npm run build
            workingDirectory: 'frontend'
            displayName: 'Build React Application'

          - script: |
              if [ ! -d "$(System.DefaultWorkingDirectory)/frontend/dist" ]; then
                echo "ERROR: Build did not create dist folder"
                ls -la $(System.DefaultWorkingDirectory)/frontend/
                exit 1
              fi
              echo "Build successful, dist folder created"
            displayName: 'Verify Build Output'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/frontend/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Create Frontend Archive'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'frontend-drop'
              publishLocation: 'Container'
            displayName: 'Publish Artifacts'

  # ============================================
  # DEPLOY STAGE
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/prod'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    dependsOn: Build
    jobs:
      - deployment: DeployFrontend
        displayName: 'Deploy Frontend to Web App'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'frontend-drop'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Artifacts'

                - script: |
                    mkdir -p $(Pipeline.Workspace)/profiles
                    echo "$(frontendPublishProfile)" > $(Pipeline.Workspace)/profiles/frontend-publishprofile.xml
                  displayName: 'Create Publish Profile from Variable'

                - task: AzureRmWebAppDeployment@4
                  inputs:
                    ConnectionType: 'PublishProfile'
                    PublishProfilePath: '$(Pipeline.Workspace)/profiles/frontend-publishprofile.xml'
                    PublishProfilePassword: '$(frontendPublishProfilePassword)'
                    PackageForLinux: '$(Pipeline.Workspace)/frontend-drop/frontend-*.zip'
                    WebAppName: '$(frontendAppName)'
                  displayName: 'Deploy Frontend using Publish Profile'

                - script: |
                    echo "==== FRONTEND DEPLOYMENT COMPLETE ===="
                    echo "Frontend URL: https://$(frontendAppName).azurewebsites.net"
                    echo ""
                    echo "Testing frontend..."
                    for i in {1..30}; do
                      status=$(curl -s -o /dev/null -w "%{http_code}" https://$(frontendAppName).azurewebsites.net/ || echo "000")
                      if [ "$status" = "200" ]; then
                        echo "✅ Frontend is live (HTTP $status)"
                        break
                      else
                        echo "⏳ Waiting for frontend... (attempt $i/30, HTTP $status)"
                        sleep 2
                      fi
                    done
                  displayName: 'Verify Frontend Deployment'
                  continueOnError: true
