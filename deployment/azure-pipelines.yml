# Azure DevOps CI/CD Pipeline for SQA Management System
# This pipeline builds and deploys both backend and frontend to Azure App Services

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure subscription connection name (configure in Azure DevOps)
  azureSubscription: 'your-azure-subscription-connection'
  
  # Backend settings
  backendAppName: 'sqa-backend-app'
  backendResourceGroup: 'your-resource-group'
  pythonVersion: '3.11'
  
  # Frontend settings
  frontendAppName: 'sqa-frontend-app'
  frontendResourceGroup: 'your-resource-group'
  nodeVersion: '20.x'

stages:
  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      # Backend Build
      - job: BuildBackend
        displayName: 'Build Backend'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              cd backend
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install Python dependencies'

          - script: |
              cd backend
              pip install pytest
              # pytest tests/ --junitxml=test-results.xml
            displayName: 'Run Backend Tests'
            continueOnError: true

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: 'backend'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
            displayName: 'Archive Backend'

          - publish: $(Build.ArtifactStagingDirectory)/backend.zip
            artifact: backend
            displayName: 'Publish Backend Artifact'

      # Frontend Build
      - job: BuildFrontend
        displayName: 'Build Frontend'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Use Node.js $(nodeVersion)'

          - script: |
              cd frontend
              npm ci
            displayName: 'Install npm dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Build React App'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: 'frontend/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
            displayName: 'Archive Frontend'

          - publish: $(Build.ArtifactStagingDirectory)/frontend.zip
            artifact: frontend
            displayName: 'Publish Frontend Artifact'

  # ============================================
  # DEPLOY STAGE
  # ============================================
  - stage: Deploy
    displayName: 'Deploy Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      # Deploy Backend
      - deployment: DeployBackend
        displayName: 'Deploy Backend to Azure'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(backendAppName)'
                    resourceGroupName: '$(backendResourceGroup)'
                    package: '$(Pipeline.Workspace)/backend/backend.zip'
                    runtimeStack: 'PYTHON|3.11'
                    startUpCommand: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app'
                  displayName: 'Deploy Backend to Azure App Service'

      # Deploy Frontend
      - deployment: DeployFrontend
        displayName: 'Deploy Frontend to Azure'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(frontendAppName)'
                    resourceGroupName: '$(frontendResourceGroup)'
                    package: '$(Pipeline.Workspace)/frontend/frontend.zip'
                    runtimeStack: 'NODE|20-lts'
                  displayName: 'Deploy Frontend to Azure App Service'
